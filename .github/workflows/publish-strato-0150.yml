name: Build STRATO v0.15.0
on:
  push:
    branches: [strato-php]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'frontend/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strato-php
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Prepare STRATO upload layout
        run: npm run package
      - name: Create update archive
        run: |
          cd upload
          zip -q -9 -r ../vfl-update-0.15.0.zip assets frontend-dist/index.html index.php server/Breitensport.php server/breitensport.json server/Core.php server/bootstrap.php server/Planning.php server/Cabins.php server/hallenplan.json
      - name: Publish built assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -A upload/assets upload/frontend-dist/index.html vfl-update-0.15.0.zip
          if ! git diff --cached --quiet; then
            git commit -m 'build: STRATO v0.15.0 assets [skip ci]'
            git push origin HEAD:strato-php
          fi
